name: Assistenza enti PDND 
description: Segnala un problema seguendo gli step richiesti
title: "[PDND]: "
labels: ["domanda"]
body:
  - type: markdown
    attributes:
      value: |
        Compila tutti i campi obbligatori.
      
  - type: input
    id: casoduso
    attributes:
      label: Caso d'uso
      placeholder: C030
    validations:
      required: false
      
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente di riferimento
      description: Scegli l'ambiente
      options: 
      - COLLAUDO
      - PRODUZIONE
    validations:
      required: true
  
  - type: markdown
    attributes:
      value: | 
        Se la chiamata è andata in 400 compilare il campo qui sotto.  
        Vi ricordiamo che se avete difficoltà ad implementare l'e-service potete scaricare un [client](https://github.com/user-attachments/files/22112526/clientAnpr-1.0.zip) di esempio in java.

     
  - type: input
    id: govwayid
    attributes:
      label: govway_id restituito
      description: Inserisci il govway_id che ti viene restituito in response
      placeholder: 
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Se l'implementazione dell'e-service è andata a buon fine ma non si trova un determinato soggetto compilare il campo qui sotto.
      
  - type: input
    id: IDANPR
    attributes:
      label: IDANPR ricercato
      description: Se la chiamata è andata bene ma non trovate un soggetto indicare l'IDANPR
      placeholder: 
    validations:
      required: false
      
  - type: textarea
    id: descrizione
    attributes:
      label: Descrizione problema
    validations:
      required: true
